<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Échecs de Poche</title>
<meta name="theme-color" content="#262421">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>:root {
  color-scheme: dark;
  --bg: #302e2b; --bg2: #262421; --panel: #3a3835; --panel2: #454240; --line: #4d4a46;
  --text: #f4f2ee; --muted: #a9a59f; --faint: #7d7973;
  --green: #81b64c; --green-hi: #95c95e; --green-sh: #537c2e;
  --gold: #f2c14e; --red: #e0463b; --blue: #5b9bd5;
  --sq-l: #ebecd0; --sq-d: #779556; --co-l: #779556; --co-d: #ebecd0;
  --hl-last: rgba(255, 255, 51, .42); --hl-sel: rgba(255, 255, 51, .55);
  --radius: 10px;
  --font: 'Figtree', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; line-height: 1.35; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--green-hi); outline-offset: 2px; }
input, select { font: inherit; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 24px; }
.topbar { display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 4px 8px; background: var(--bg2); }
.topbar h1 { flex: 1; font-size: 17px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.iconbtn { width: 42px; height: 42px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:active { background: var(--panel); }
.iconbtn.on { color: var(--gold); }
.tabbar { display: flex; background: var(--bg2); border-top: 1px solid #1d1c1a; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px; font-size: 11px; color: var(--faint); font-weight: 600; }
.tabbar button.on { color: var(--text); }
.tabbar button.on .ico { color: var(--green-hi); }

/* ---- boutons ---- */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 16px; border-radius: var(--radius); background: var(--panel2); font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 #2a2826; transition: transform .06s; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2a2826; }
.btn.primary { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-sh); font-size: 18px; text-shadow: 0 1px 0 rgba(0, 0, 0, .2); }
.btn.primary:active { box-shadow: 0 2px 0 var(--green-sh); }
.btn.small { padding: 9px 12px; font-size: 14px; box-shadow: 0 3px 0 #2a2826; width: auto; }
.btn.ghost { background: transparent; box-shadow: none; border: 1px solid var(--line); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 12px; border-radius: 20px; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 13px; border: 1px solid transparent; }
.chip.on { background: #4b5b3a; color: #fff; border-color: var(--green); }
.section-t { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 700; margin: 22px 0 10px; }
.card { background: var(--panel); border-radius: var(--radius); padding: 14px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---- accueil ---- */
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 4px 2px; }
.brand-mark { width: 40px; height: 40px; }
.brand-name { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.brand-name span { color: var(--green-hi); }
.home-actions { display: grid; gap: 14px; margin-top: 14px; }
.big-choice { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px; background: var(--panel); text-align: left; box-shadow: 0 4px 0 #2a2826; width: 100%; }
.big-choice:active { transform: translateY(2px); box-shadow: 0 2px 0 #2a2826; }
.big-choice .bc-ico { width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; background: var(--panel2); flex: none; overflow: hidden; }
.big-choice .bc-ico .ico { width: 28px; height: 28px; }
.big-choice b { display: block; font-size: 17px; }
.big-choice small { color: var(--muted); font-size: 13px; display: block; margin-top: 2px; }
.big-choice.primary { background: var(--green); box-shadow: 0 4px 0 var(--green-sh); }
.big-choice.primary small { color: #eaf6dc; }
.big-choice.primary .bc-ico { background: rgba(0, 0, 0, .15); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--panel); border-radius: 12px; padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
.tile .ico { width: 26px; height: 26px; color: var(--green-hi); }
.tile small { color: var(--muted); font-weight: 500; font-size: 11px; }
.resume { display: flex; gap: 12px; align-items: center; background: var(--panel); padding: 10px; border-radius: 12px; width: 100%; text-align: left; border: 1px solid #5a6f45; }
.resume .mini { width: 72px; flex: none; }
.stat-strip { display: flex; gap: 10px; }
.stat { flex: 1; background: var(--bg2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* ---- échiquier ---- */
.board { position: relative; width: 100%; aspect-ratio: 1; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; }
.sq-layer { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
.sq { position: relative; }
.sq.l { background: var(--sq-l); } .sq.d { background: var(--sq-d); }
.co { position: absolute; font-size: clamp(9px, 2.6vw, 13px); font-weight: 700; line-height: 1; pointer-events: none; }
.sq.l .co { color: var(--co-l); } .sq.d .co { color: var(--co-d); }
.co-f { right: 4%; bottom: 3%; } .co-r { left: 4%; top: 4%; }
.hl-layer, .pc-layer, .dot-layer, .badge-layer, .arrow-layer { position: absolute; inset: 0; pointer-events: none; }
.hl, .dot, .badge { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; }
.hl.last { background: var(--hl-last); }
.hl.sel { background: var(--hl-sel); }
.hl.pre { background: rgba(214, 79, 0, .45); }
.hl.hint { background: rgba(62, 160, 255, .45); box-shadow: inset 0 0 0 3px rgba(62, 160, 255, .9); }
.hl.mark { background: rgba(235, 97, 80, .55); }
.hl.hover { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .7); }
.hl.check { background: radial-gradient(circle, rgba(255, 0, 0, .95) 0, rgba(231, 0, 0, .6) 30%, rgba(169, 0, 0, 0) 72%); }
.dot::after { content: ''; position: absolute; left: 34%; top: 34%; width: 32%; height: 32%; border-radius: 50%; background: rgba(0, 0, 0, .16); }
.dot.cap::after { left: 3%; top: 3%; width: 94%; height: 94%; background: transparent; box-shadow: inset 0 0 0 clamp(4px, 1.3vw, 7px) rgba(0, 0, 0, .16); }
.pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; background-size: 100% 100%; will-change: transform; transition: transform 180ms cubic-bezier(.25, .8, .35, 1); z-index: 2; }
.pc.dragging { z-index: 10; transition: none !important; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .35)); }
.pc.static { position: absolute; transition: none; }
.pc.star { background: none !important; }
.pc.star::after { content: ''; position: absolute; inset: 18%; background: var(--gold); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .25)); animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(.88) rotate(8deg); } }
.badge { z-index: 5; }
.badge span { position: absolute; right: -9%; top: -9%; min-width: 44%; height: 44%; padding: 0 3px; border-radius: 50%; color: #fff; font-weight: 800; font-size: clamp(9px, 2.6vw, 13px); display: grid; place-items: center; box-shadow: 0 2px 3px rgba(0, 0, 0, .35); border: 2px solid rgba(255, 255, 255, .9); }
.arrow-layer { width: 100%; height: 100%; z-index: 4; }
.promo-ov { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, .35); }
.promo-col { position: absolute; top: 0; width: 12.5%; background: #fff; border-radius: 4px; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); display: flex; flex-direction: column; }
.promo-col.up { top: auto; bottom: 0; flex-direction: column-reverse; }
.promo-btn { position: relative; width: 100%; aspect-ratio: 1; }
.promo-btn .pc { width: 100%; height: 100%; }
.promo-btn:active { background: #e3e3e3; }
.promo-x { height: 26px; color: #777; display: grid; place-items: center; background: #f1f1f1; }
.mini { position: relative; aspect-ratio: 1; width: 100%; border-radius: 4px; overflow: hidden; background: repeating-conic-gradient(var(--sq-d) 0 25%, var(--sq-l) 0 50%) 0 0 / 25% 25%; }
.mini .pc { width: 12.5%; height: 12.5%; }

/* ---- partie ---- */
.game { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.game-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
.board-wrap { width: 100%; margin: 0 auto; }
.pbar { display: flex; align-items: center; gap: 10px; padding: 7px 10px; min-height: 52px; }
.pbar .av { width: 38px; height: 38px; border-radius: 6px; overflow: hidden; flex: none; background: var(--panel); }
.avatar-svg { width: 100%; height: 100%; display: block; }
.pbar .pinfo { flex: 1; min-width: 0; }
.pbar .pname { line-height: 1.25; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar .pname small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.caps { display: flex; align-items: center; height: 18px; margin-top: 2px; }
.caps .cp { width: 16px; height: 16px; margin-right: -5px; background-size: 100% 100%; }
.caps .gap { width: 8px; }
.caps .adv { margin-left: 9px; font-size: 12px; color: var(--muted); font-weight: 700; }
.clock { line-height: 1.1; min-width: 84px; padding: 7px 10px; border-radius: 6px; background: #262421; color: #8b8986; font-weight: 700; font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
.clock.run { background: #ffffff; color: #262421; }
.clock.low.run { background: #d44f45; color: #fff; }
.thinking { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
.thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: dots 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 50% { opacity: .2; transform: translateY(-2px); } }
.bubble-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px 8px; min-height: 72px; }
.bubble-row .av { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex: none; border: 2px solid var(--panel2); }
.bubble { position: relative; flex: 1; background: #fff; color: #262421; border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.38; font-weight: 500; }
.bubble::before { content: ''; position: absolute; left: -7px; top: 16px; border: 8px solid transparent; border-left: 0; border-right-color: #fff; }
.bubble .cls { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; margin-right: 4px; }
.bubble .cls i { font-style: normal; color: #fff; border-radius: 50%; min-width: 20px; height: 20px; padding: 0 3px; display: inline-grid; place-items: center; font-size: 11px; }
.bubble .b-act { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.bubble .b-act button { background: #efeeea; border-radius: 7px; padding: 6px 10px; font-weight: 700; font-size: 13px; color: #3a3835; }
.bubble .b-act button.pri { background: var(--green); color: #fff; }
.op-name { font-size: 12px; color: var(--muted); padding: 4px 12px 0; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.movestrip { display: flex; gap: 2px; overflow-x: auto; padding: 8px 10px; background: var(--bg2); scrollbar-width: none; min-height: 38px; align-items: center; }
.movestrip::-webkit-scrollbar { display: none; }
.movestrip .mn { color: var(--faint); font-size: 13px; padding: 0 2px 0 6px; flex: none; }
.movestrip .mv { line-height: 1.2; flex: none; padding: 4px 6px; border-radius: 5px; font-weight: 600; font-size: 14px; color: #d6d3ce; display: inline-flex; align-items: center; gap: 3px; }
.movestrip .mv.cur { background: #54514d; color: #fff; border-bottom: 2px solid #8e8b86; }
.movestrip .mv i { font-style: normal; font-size: 10px; font-weight: 800; color: #fff; border-radius: 50%; min-width: 15px; height: 15px; display: inline-grid; place-items: center; padding: 0 2px; }
.movestrip .empty { color: var(--faint); font-size: 13px; }
.actionbar { display: flex; background: var(--bg2); padding: 4px 4px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid #1d1c1a; }
.actionbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--muted); border-radius: 8px; }
.actionbar button:active { background: var(--panel); }
.actionbar button[disabled] { opacity: .35; }
.actionbar .ico { width: 24px; height: 24px; }
.actionbar button.hot { color: var(--gold); }

/* ---- feuilles & modales ---- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { background: var(--bg2); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 88%; overflow-y: auto; animation: up .2s cubic-bezier(.2, .8, .3, 1); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 12px; }
.sheet h2 { margin: 2px 0 12px; font-size: 18px; }
.sheet-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 6px; font-weight: 600; text-align: left; border-bottom: 1px solid #33312e; }
.sheet-item .ico { color: var(--muted); }
.sheet-item.danger { color: #f07a70; } .sheet-item.danger .ico { color: #f07a70; }
.modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 60; display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.modal { background: var(--bg2); border-radius: 14px; width: 100%; max-width: 380px; padding: 20px 18px 18px; text-align: center; animation: pop .22s cubic-bezier(.2, 1.3, .4, 1); }
.modal h2 { margin: 6px 0 4px; font-size: 24px; }
.modal .sub { color: var(--muted); margin-bottom: 14px; }
.modal .btns { display: grid; gap: 10px; margin-top: 16px; }
.end-avs { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 10px 0; }
.end-avs .av { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--panel); position: relative; }
.end-avs .av.win { box-shadow: 0 0 0 3px var(--green); }
.end-avs .vs { color: var(--muted); font-weight: 800; }
.delta { font-weight: 800; }
.delta.up { color: var(--green-hi); } .delta.down { color: #f07a70; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 20px; font-weight: 600; font-size: 14px; z-index: 80; animation: fade .2s; max-width: 90%; text-align: center; }

/* ---- choix du bot ---- */
.bot-hero { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.bot-hero .av { width: 84px; height: 84px; border-radius: 12px; overflow: hidden; flex: none; }
.bot-hero .bubble { font-size: 14px; }
.bot-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.bot-cell { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; background: var(--panel); border: 3px solid transparent; }
.bot-cell.on { border-color: var(--green); }
.bot-cell .elo { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; font-weight: 800; background: rgba(0, 0, 0, .55); color: #fff; text-align: center; padding: 1px 0; }
.bot-cell .rec { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); color: #262421; display: grid; place-items: center; }
.bot-cell .rec .ico { width: 11px; height: 11px; stroke-width: 3; }
.bot-title { font-size: 20px; font-weight: 800; }
.bot-title small { color: var(--muted); font-weight: 600; font-size: 14px; margin-left: 6px; }
.seg { display: flex; background: var(--panel); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 8px; font-weight: 700; font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--panel2); color: #fff; box-shadow: 0 2px 0 #2a2826; }
.kdot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #999; }
.kdot.w { background: #fff; } .kdot.b { background: #111; } .kdot.r { background: linear-gradient(90deg, #fff 50%, #111 50%); }
.rec-note { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 10px; }
.rec-note .ico { color: var(--gold); width: 18px; height: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input[type=text] { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 10px 12px; }

/* ---- listes ---- */
.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: var(--panel); text-align: left; width: 100%; }
.li .mini { width: 56px; flex: none; }
.li .li-main { flex: 1; min-width: 0; }
.li b { display: block; font-size: 15px; }
.li small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
.li .tag { font-size: 11px; font-weight: 800; color: var(--faint); background: var(--bg2); padding: 3px 6px; border-radius: 5px; flex: none; }
.li .done { color: var(--green-hi); }
.pill { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 10px; background: var(--bg2); color: var(--muted); margin-right: 4px; }
.era { display: grid; grid-template-columns: 14px 1fr; gap: 10px; margin-top: 18px; }
.era-rail { position: relative; }
.era-rail::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: -18px; width: 2px; background: var(--line); }
.era-rail::after { content: ''; position: absolute; left: 1px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--bg); }
.era-h { margin-bottom: 8px; } .era-h b { font-size: 16px; } .era-h span { color: var(--faint); font-size: 12px; margin-left: 6px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 10px; padding: 0 12px; margin-bottom: 10px; }
.search input { flex: 1; background: none; border: 0; color: var(--text); padding: 11px 0; outline: none; }
.search .ico { color: var(--faint); width: 18px; height: 18px; }

/* ---- détail ouverture / leçon ---- */
.navrow { display: flex; gap: 6px; margin: 10px 0; }
.navrow button { flex: 1; background: var(--panel); border-radius: 8px; padding: 9px 0; display: grid; place-items: center; color: #ddd; box-shadow: 0 3px 0 #2a2826; }
.navrow button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a2826; }
.movelist { display: flex; flex-wrap: wrap; gap: 2px 0; line-height: 1.9; font-size: 14.5px; }
.movelist .mn { color: var(--faint); margin: 0 3px 0 6px; }
.movelist .mv { padding: 1px 5px; border-radius: 4px; font-weight: 600; }
.movelist .mv.cur { background: #54514d; }
.prose { line-height: 1.55; color: #e2dfda; max-width: 65ch; }
.prose p { margin: 0 0 10px; }
.ideas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ideas .card h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.ideas ul { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.45; color: #d9d6d0; }
@media (max-width: 380px) { .ideas { grid-template-columns: 1fr; } }

<script type="text/plain" id="engine-src">/* ===== Moteur d'échecs : règles + recherche (0x88) ===== */
var Engine = (function () {
  'use strict';
  var PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
  var N_OFF = [33, 31, 18, 14, -33, -31, -18, -14];
  var B_OFF = [17, 15, -17, -15];
  var R_OFF = [16, 1, -16, -1];
  var K_OFF = [17, 15, -17, -15, 16, 1, -16, -1];
  var F_CAP = 1, F_EP = 2, F_CASTLE = 4, F_DOUBLE = 8;
  var VAL = [0, 100, 320, 330, 500, 900, 20000];
  var MATE = 30000, INF = 32000;

  function mv(from, to, promo, fl) { return from | (to << 7) | (promo << 14) | (fl << 17); }
  function mFrom(m) { return m & 127; }
  function mTo(m) { return (m >> 7) & 127; }
  function mPromo(m) { return (m >> 14) & 7; }
  function mFlags(m) { return m >>> 17; }

  // ---- Zobrist ----
  var seed = 0x9e3779b9;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
  var ZP_LO = new Int32Array(16 * 128), ZP_HI = new Int32Array(16 * 128);
  var ZC_LO = new Int32Array(16), ZC_HI = new Int32Array(16);
  var ZE_LO = new Int32Array(128), ZE_HI = new Int32Array(128);
  for (var i = 0; i < 16 * 128; i++) { ZP_LO[i] = rnd(); ZP_HI[i] = rnd(); }
  for (i = 0; i < 16; i++) { ZC_LO[i] = rnd(); ZC_HI[i] = rnd(); }
  for (i = 0; i < 128; i++) { ZE_LO[i] = rnd(); ZE_HI[i] = rnd(); }
  var ZT_LO = rnd(), ZT_HI = rnd();

  var CASTLE_MASK = new Int32Array(128);
  for (i = 0; i < 128; i++) CASTLE_MASK[i] = 15;
  CASTLE_MASK[0] = 15 & ~2; CASTLE_MASK[7] = 15 & ~1; CASTLE_MASK[4] = 15 & ~3;
  CASTLE_MASK[112] = 15 & ~8; CASTLE_MASK[119] = 15 & ~4; CASTLE_MASK[116] = 15 & ~12;

  var FILES = 'abcdefgh';
  function sqName(s) { return FILES[s & 7] + ((s >> 4) + 1); }
  function sqParse(n) { return (n.charCodeAt(1) - 49) * 16 + (n.charCodeAt(0) - 97); }
  var PCH = ' pnbrqk';

  var STACK = 2048;
  function Pos() {
    this.b = new Int8Array(128);
    this.turn = 0; this.castle = 0; this.ep = -1; this.half = 0; this.full = 1;
    this.kings = [4, 116]; this.hlo = 0; this.hhi = 0;
    this.sp = 0;
    this.stM = new Int32Array(STACK); this.stCap = new Int8Array(STACK);
    this.stCastle = new Int8Array(STACK); this.stEp = new Int16Array(STACK);
    this.stHalf = new Int16Array(STACK); this.stLo = new Int32Array(STACK); this.stHi = new Int32Array(STACK);
  }
  var P = Pos.prototype;

  P.epHashable = function () {
    // la case e.p. n'est hachée que si une prise e.p. est géométriquement possible
    if (this.ep < 0) return false;
    var b = this.b, ep = this.ep;
    if (this.turn === 0) { var p = 1; return (!((ep - 15) & 0x88) && b[ep - 15] === p) || (!((ep - 17) & 0x88) && b[ep - 17] === p); }
    var q = 9; return (!((ep + 15) & 0x88) && b[ep + 15] === q) || (!((ep + 17) & 0x88) && b[ep + 17] === q);
  };

  P.computeHash = function () {
    var lo = 0, hi = 0, b = this.b;
    for (var s = 0; s < 128; s++) { if (s & 0x88) { s += 7; continue; } if (b[s]) { lo ^= ZP_LO[b[s] * 128 + s]; hi ^= ZP_HI[b[s] * 128 + s]; } }
    lo ^= ZC_LO[this.castle]; hi ^= ZC_HI[this.castle];
    if (this.epHashable()) { lo ^= ZE_LO[this.ep]; hi ^= ZE_HI[this.ep]; }
    if (this.turn) { lo ^= ZT_LO; hi ^= ZT_HI; }
    this.hlo = lo; this.hhi = hi;
  };

  P.load = function (fen) {
    var parts = fen.trim().split(/\s+/);
    var b = this.b; b.fill(0);
    var rows = parts[0].split('/');
    if (rows.length !== 8) throw new Error('FEN invalide');
    for (var r = 0; r < 8; r++) {
      var f = 0, row = rows[r];
      for (var k = 0; k < row.length; k++) {
        var c = row[k];
        if (c >= '1' && c <= '8') { f += +c; continue; }
        var t = PCH.indexOf(c.toLowerCase()); if (t < 1) throw new Error('FEN invalide');
        var col = c === c.toLowerCase() ? 1 : 0;
        var sq = (7 - r) * 16 + f; b[sq] = t | (col << 3);
        if (t === KING) this.kings[col] = sq;
        f++;
      }
    }
    this.turn = parts[1] === 'b' ? 1 : 0;
    var cs = parts[2] || '-'; this.castle = 0;
    if (cs.indexOf('K') >= 0) this.castle |= 1; if (cs.indexOf('Q') >= 0) this.castle |= 2;
    if (cs.indexOf('k') >= 0) this.castle |= 4; if (cs.indexOf('q') >= 0) this.castle |= 8;
    this.ep = (parts[3] && parts[3] !== '-') ? sqParse(parts[3]) : -1;
    this.half = parseInt(parts[4] || '0', 10) || 0;
    this.full = parseInt(parts[5] || '1', 10) || 1;
    this.sp = 0; this.computeHash();
    return this;
  };

  P.fen = function () {
    var s = '', b = this.b;
    for (var r = 7; r >= 0; r--) {
      var e = 0;
      for (var f = 0; f < 8; f++) {
        var p = b[r * 16 + f];
        if (!p) { e++; continue; }
        if (e) { s += e; e = 0; }
        var ch = PCH[p & 7]; s += (p >> 3) ? ch : ch.toUpperCase();
      }
      if (e) s += e; if (r) s += '/';
    }
    var c = '';
    if (this.castle & 1) c += 'K'; if (this.castle & 2) c += 'Q'; if (this.castle & 4) c += 'k'; if (this.castle & 8) c += 'q';
    return s + ' ' + (this.turn ? 'b' : 'w') + ' ' + (c || '-') + ' ' + (this.epHashable() ? sqName(this.ep) : '-') + ' ' + this.half + ' ' + this.full;
  };

  P.clone = function () { var p = new Pos(); p.load(this.fen()); return p; };

  P.attacked = function (sq, by) {
    var b = this.b, t, i, d, s, p;
    if (by === 0) {
      t = sq - 15; if (!(t & 0x88) && b[t] === 1) return true;
      t = sq - 17; if (!(t & 0x88) && b[t] === 1) return true;
    } else {
      t = sq + 15; if (!(t & 0x88) && b[t] === 9) return true;
      t = sq + 17; if (!(t & 0x88) && b[t] === 9) return true;
    }
    var cb = by << 3;
    for (i = 0; i < 8; i++) { t = sq + N_OFF[i]; if (!(t & 0x88) && b[t] === (KNIGHT | cb)) return true; }
    for (i = 0; i < 8; i++) { t = sq + K_OFF[i]; if (!(t & 0x88) && b[t] === (KING | cb)) return true; }
    for (i = 0; i < 4; i++) {
      d = B_OFF[i]; s = sq + d;
      while (!(s & 0x88)) { p = b[s]; if (p) { if (p === (BISHOP | cb) || p === (QUEEN | cb)) return true; break; } s += d; }
      d = R_OFF[i]; s = sq + d;
      while (!(s & 0x88)) { p = b[s]; if (p) { if (p === (ROOK | cb) || p === (QUEEN | cb)) return true; break; } s += d; }
    }
    return false;
  };

  // liste des cases attaquant sq pour la couleur by
  P.attackers = function (sq, by) {
    var b = this.b, out = [], t, i, d, s, p, cb = by << 3;
    if (by === 0) { t = sq - 15; if (!(t & 0x88) && b[t] === 1) out.push(t); t = sq - 17; if (!(t & 0x88) && b[t] === 1) out.push(t); }
    else { t = sq + 15; if (!(t & 0x88) && b[t] === 9) out.push(t); t = sq + 17; if (!(t & 0x88) && b[t] === 9) out.push(t); }
    for (i = 0; i < 8; i++) { t = sq + N_OFF[i]; if (!(t & 0x88) && b[t] === (KNIGHT | cb)) out.push(t); }
    for (i = 0; i < 8; i++) { t = sq + K_OFF[i]; if (!(t & 0x88) && b[t] === (KING | cb)) out.push(t); }
    for (i = 0; i < 4; i++) {
      d = B_OFF[i]; s = sq + d;
      while (!(s & 0x88)) { p = b[s]; if (p) { if (p === (BISHOP | cb) || p === (QUEEN | cb)) out.push(s); break; } s += d; }
      d = R_OFF[i]; s = sq + d;
      while (!(s & 0x88)) { p = b[s]; if (p) { if (p === (ROOK | cb) || p === (QUEEN | cb)) out.push(s); break; } s += d; }
    }
    return out;
  };

  P.inCheck = function () { return this.attacked(this.kings[this.turn], this.turn ^ 1); };

  P.gen = function (out, capsOnly) {
    var b = this.b, us = this.turn, them = us ^ 1, cu = us << 3, n = out.length;
    for (var s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }
      var p = b[s]; if (!p || (p >> 3) !== us) continue;
      var t = p & 7, to, q, i, d;
      if (t === PAWN) {
        var dir = us ? -16 : 16, startR = us ? 6 : 1, promR = us ? 0 : 7;
        to = s + dir;
        if (!capsOnly || (to >> 4) === promR) {
          if (!(to & 0x88) && !b[to]) {
            if ((to >> 4) === promR) { for (q = QUEEN; q >= KNIGHT; q--) out[n++] = mv(s, to, q, 0); }
            else {
              out[n++] = mv(s, to, 0, 0);
              if ((s >> 4) === startR && !b[to + dir]) out[n++] = mv(s, to + dir, 0, F_DOUBLE);
            }
          }
        }
        for (i = -1; i <= 1; i += 2) {
          to = s + dir + i; if (to & 0x88) continue;
          var c = b[to];
          if (c && (c >> 3) === them) {
            if ((to >> 4) === promR) { for (q = QUEEN; q >= KNIGHT; q--) out[n++] = mv(s, to, q, F_CAP); }
            else out[n++] = mv(s, to, 0, F_CAP);
          } else if (to === this.ep) out[n++] = mv(s, to, 0, F_CAP | F_EP);
        }
      } else if (t === KNIGHT || t === KING) {
        var offs = t === KNIGHT ? N_OFF : K_OFF;
        for (i = 0; i < 8; i++) {
          to = s + offs[i]; if (to & 0x88) continue;
          var c2 = b[to];
          if (!c2) { if (!capsOnly) out[n++] = mv(s, to, 0, 0); }
          else if ((c2 >> 3) === them) out[n++] = mv(s, to, 0, F_CAP);
        }
        if (t === KING && !capsOnly) {
          if (us === 0 && s === 4) {
            if ((this.castle & 1) && b[7] === 4 && !b[5] && !b[6] && !this.attacked(4, 1) && !this.attacked(5, 1) && !this.attacked(6, 1)) out[n++] = mv(4, 6, 0, F_CASTLE);
            if ((this.castle & 2) && b[0] === 4 && !b[3] && !b[2] && !b[1] && !this.attacked(4, 1) && !this.attacked(3, 1) && !this.attacked(2, 1)) out[n++] = mv(4, 2, 0, F_CASTLE);
          } else if (us === 1 && s === 116) {
            if ((this.castle & 4) && b[119] === 12 && !b[117] && !b[118] && !this.attacked(116, 0) && !this.attacked(117, 0) && !this.attacked(118, 0)) out[n++] = mv(116, 118, 0, F_CASTLE);
            if ((this.castle & 8) && b[112] === 12 && !b[115] && !b[114] && !b[113] && !this.attacked(116, 0) && !this.attacked(115, 0) && !this.attacked(114, 0)) out[n++] = mv(116, 114, 0, F_CASTLE);
          }
        }
      } else {
        var dirs = t === BISHOP ? B_OFF : t === ROOK ? R_OFF : K_OFF;
        for (i = 0; i < dirs.length; i++) {
          d = dirs[i]; to = s + d;
          while (!(to & 0x88)) {
            var c3 = b[to];
            if (!c3) { if (!capsOnly) out[n++] = mv(s, to, 0, 0); }
            else { if ((c3 >> 3) === them) out[n++] = mv(s, to, 0, F_CAP); break; }
            to += d;
          }
        }
      }
    }
    out.length = n;
    return out;
  };

  P.make = function (m) {
    var b = this.b, from = m & 127, to = (m >> 7) & 127, promo = (m >> 14) & 7, fl = m >>> 17;
    var p = b[from], cap = b[to], us = this.turn, i = this.sp++;
    this.stM[i] = m; this.stCastle[i] = this.castle; this.stEp[i] = this.ep; this.stHalf[i] = this.half;
    this.stLo[i] = this.hlo; this.stHi[i] = this.hhi;
    var lo = this.hlo, hi = this.hhi;

/* ===== Client moteur (Web Worker) ===== */
function engineHandle(d, post) {
  var E = Engine;
  function build(fen, moves) {
    var p = new E.Pos().load(fen || E.START);
    for (var i = 0; i < (moves || []).length; i++) { var m = p.parseMove(moves[i]); if (!m) break; p.make(m); }
    return p;
  }
  try {
    if (d.cmd === 'search') {
      var p = build(d.fen, d.moves);
      var r = E.search(p, { time: d.time, depth: d.depth });
      var bestSan = r.move ? p.san(r.move) : '';
      post({ id: d.id, move: r.move ? E.uci(r.move) : null, san: bestSan, score: r.score, depth: r.depth, pv: r.pv.map(E.uci) });
    } else if (d.cmd === 'roots') {
      var p2 = build(d.fen, d.moves);
      var L = E.rootScores(p2, d.depth, d.time);
      post({ id: d.id, list: L.map(function (x) { return { u: E.uci(x.move), s: x.score }; }) });
    } else if (d.cmd === 'review') {
      var p3 = new E.Pos().load(d.fen || E.START), out = [], n = d.moves.length;
      E.clearTT();
      for (var i = 0; i <= n; i++) {
        var L3 = p3.legal(), res;
        if (!L3.length) res = { best: null, score: p3.inCheck() ? -E.MATE : 0, pv: [], san: '' };
        else if (p3.isRepetition(2) || p3.half >= 100 || p3.insufficient()) res = { best: null, score: 0, pv: [], san: '' };
        else { var r3 = E.search(p3, { time: d.time || 350, depth: d.depth || 14 }); res = { best: E.uci(r3.move), score: r3.score, pv: r3.pv.map(E.uci), san: p3.san(r3.move, L3) }; }
        out.push(res);
        post({ id: d.id, progress: (i + 1) / (n + 1) });
        if (i < n) { var mm = p3.parseMove(d.moves[i]); if (!mm) break; p3.make(mm); }
      }
      post({ id: d.id, evals: out });
    }
  } catch (err) { post({ id: d.id, error: String(err && err.message || err) }); }
}

var EngineProto = {
  init: function () {

      var url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));

function botChoose(elo, fen, moves, fenNow, allowBook) {
  var P = paramsForElo(elo);
  if (allowBook && Math.random() < P.book) { var b = Book.pick(fenNow); if (b) return Promise.resolve(b); }
  if (P.time) {
    return EngineClient.req({ cmd: 'search', fen: fen, moves: moves, time: P.time, depth: P.depth }).then(function (r) {
      if (P.bl && Math.random() < P.bl) {
        return EngineClient.req({ cmd: 'roots', fen: fen, moves: moves, depth: 2, time: 600 }).then(function (x) { var L = x.list; return L[Math.min(L.length - 1, 1 + Math.floor(Math.random() * 2))].u; });
      }
      return r.move;
    });
  }
  return EngineClient.req({ cmd: 'roots', fen: fen, moves: moves, depth: P.d, time: 2500 }).then(function (x) {
    var L = x.list; if (!L.length) return null;
    if (Math.random() < P.bl) {
      // gaffe « humaine » : un coup plausible mais pas le meilleur
      var pool = L.slice(Math.min(2, L.length - 1));
      return pickRand(pool).u;
    }
    var M = Engine.MATE, top = L[0].s;
    if (top > M - 500) return L[0].u; // ne rate pas un mat trouvé
    var w = L.map(function (e) { return Math.exp((Math.max(-2000, e.s) - top) / P.T); }), tot = w.reduce(function (a, b) { return a + b; }, 0), r = Math.random() * tot;

    return L[0].u;

}

/* ===== Import de partie (PGN collé ou saisie des coups) ===== */
function parsePGN(text) {

  for (var i = 0; i < text.length; i++) { var c = text[i]; if (c === '(') depth++; else if (c === ')') depth = Math.max(0, depth - 1); else if (!depth) out += c; }

  try { p = new Engine.Pos().load(start); } catch (e) { return { error: 'La position FEN de départ est invalide.' }; }

  var FRM = { R: 'K', D: 'Q', T: 'R', F: 'B', C: 'N' };
  var uci = [];
  for (var k = 0; k < toks.length; k++) {
    var t0 = toks[k].replace(/[!?]+/g, '').replace(/^[♔♕♖♗♘]/, function (c) { return { '♔': 'K', '♕': 'Q', '♖': 'R', '♗': 'B', '♘': 'N' }[c]; });

    var m = p.parseMove(t0);
    if (!m && /^[RDTFC]/.test(t0)) m = p.parseMove(FRM[t0[0]] + t0.slice(1));
    if (!m) return { error: 'Coup illisible ou illégal : « ' + toks[k] + ' » (demi-coup ' + (k + 1) + ').', headers: headers, uci: uci };
    uci.push(Engine.uci(m)); p.make(m);
  }
  if (!uci.length) return { error: 'Aucun coup trouvé.' };
  return { headers: headers, uci: uci, start: start, result: result };
}

        if (L.length > 1) b.askPromotion(t, p.turn === 0 ? 'w' : 'b').then(function (x) { if (x) go(f + t + x); else refresh(true); }); else go(Engine.uci(L[0]));
      }
      refresh(false);
      pane.appendChild(common(function () {
        if (moves.length < 2) { toast('Saisis au moins quelques coups'); return; }
        var res = '*'; if (!p.legal().length && p.inCheck()) res = p.turn === 0 ? '0-1' : '1-0';
        launch(moves.slice(), Engine.START, res);
      }));
    }
  }
  drawSeg(); draw();
  return wrap;
};

    function start(){ EngineClient.init(); ReviewEngine.init(); Book.init(); App.applyLook();
      var saved=Store.get('current',null);
      App.go('home',{},{root:true});
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
  })();</script>
